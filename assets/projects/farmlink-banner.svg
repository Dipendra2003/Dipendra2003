<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 250">
  <defs>
    <!-- Dark, earthy modern gradient -->
    <linearGradient id="bg-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#061f14" /> <!-- very dark emerald -->
      <stop offset="100%" stop-color="#020617" /> <!-- slate black -->
    </linearGradient>

    <!-- Farm/AI Accent -->
    <linearGradient id="accent-grad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#eab308" /> <!-- yellow -->
      <stop offset="50%" stop-color="#22c55e" /> <!-- green -->
      <stop offset="100%" stop-color="#0ea5e9" /> <!-- blue -->
    </linearGradient>

    <!-- Text Gradient -->
    <linearGradient id="text-grad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#f8fafc" />
      <stop offset="100%" stop-color="#a7f3d0" />
    </linearGradient>

    <!-- Subtle Grid Pattern -->
    <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M 40 0 L 0 0 0 40" fill="none" stroke="#22c55e" stroke-width="0.5" stroke-opacity="0.05" />
    </pattern>

    <!-- Glow Filter -->
    <filter id="glow" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="6" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
    
    <!-- Drop Shadow -->
    <filter id="shadow" x="-10%" y="-10%" width="130%" height="130%">
      <feDropShadow dx="0" dy="10" stdDeviation="15" flood-color="#000000" flood-opacity="0.6"/>
    </filter>
  </defs>

  <style>
    @import url('https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;800&amp;display=swap');
    
    .title { font-family: 'Inter', sans-serif; font-size: 46px; font-weight: 800; fill: url(#text-grad); letter-spacing: -1px; }
    .subtitle { font-family: 'Inter', sans-serif; font-size: 20px; font-weight: 500; fill: #94a3b8; }
    .badge-text { font-family: 'Inter', sans-serif; font-size: 13px; font-weight: 600; fill: #22c55e; letter-spacing: 1px; }
    
    /* Animations */
    .float { animation: float-anim 6s ease-in-out infinite; transform-origin: center; }
    @keyframes float-anim {
      0%, 100% { transform: translateY(0px); }
      50% { transform: translateY(-6px); }
    }
    
    .tractor { animation: drive 10s linear infinite; }
    @keyframes drive {
      0% { transform: translateX(-40px); }
      100% { transform: translateX(260px); }
    }
    
    .wheel { animation: spin 2s linear infinite; }
    @keyframes spin {
      100% { transform: rotate(360deg); }
    }
    
    .drone { animation: drone-hover 4s ease-in-out infinite; }
    @keyframes drone-hover {
      0%, 100% { transform: translate(180px, 30px); }
      50% { transform: translate(180px, 20px); }
    }
    
    .scan-beam { animation: scan 2s ease-in-out infinite alternate; }
    @keyframes scan {
      0% { opacity: 0.1; }
      100% { opacity: 0.5; }
    }
    
    .pulse { animation: pulsing 3s ease-in-out infinite alternate; }
    @keyframes pulsing {
      0% { r: 15px; opacity: 0.3; }
      100% { r: 25px; opacity: 0.1; }
    }
  </style>

  <!-- Background Base -->
  <rect width="100%" height="100%" fill="url(#bg-grad)" rx="16" stroke="#064e3b" stroke-width="1"/>
  <rect width="100%" height="100%" fill="url(#grid)" rx="16" />
  
  <!-- Top Accent Line -->
  <rect width="100%" height="4" fill="url(#accent-grad)" rx="2" />

  <!-- Left Content -->
  <g transform="translate(50, 60)">
    <!-- Featured Badge -->
    <g transform="translate(0, 0)">
      <rect x="0" y="0" width="175" height="28" rx="14" fill="#22c55e" fill-opacity="0.1" stroke="#22c55e" stroke-opacity="0.3" stroke-width="1"/>
      <circle cx="14" cy="14" r="4" fill="#22c55e" filter="url(#glow)"/>
      <text class="badge-text" x="26" y="19">FEATURED PROJECT</text>
    </g>

    <!-- Text -->
    <text class="title" x="0" y="75">FarmLink AI</text>
    <text class="subtitle" x="2" y="110">AI-Powered Agricultural Marketplace</text>
  </g>

  <!-- Right Content: Sleek Farm Dashboard Graphic -->
  <g transform="translate(500, 50)" filter="url(#shadow)">
    <g class="float">
      <!-- Main Card -->
      <rect x="0" y="0" width="260" height="150" rx="12" fill="#020617" stroke="#064e3b" stroke-width="1"/>
      
      <!-- Card Header -->
      <rect x="0" y="0" width="260" height="30" rx="12" fill="#064e3b"/>
      <rect x="0" y="15" width="260" height="15" fill="#064e3b"/>
      <circle cx="15" cy="15" r="3" fill="#34d399"/>
      <circle cx="27" cy="15" r="3" fill="#eab308"/>
      <text x="45" y="19" font-family="Inter" font-size="10" fill="#a7f3d0" font-weight="600" letter-spacing="0.5">SMART FARM OVERVIEW</text>
      
      <!-- Glowing Sun/Weather element -->
      <circle cx="210" cy="55" r="15" fill="#eab308" filter="url(#glow)"/>
      <circle cx="210" cy="55" class="pulse" fill="#eab308"/>

      <!-- Digital Crop Rows (Bar Charts) -->
      <g transform="translate(20, 110)">
        <rect x="0" y="-30" width="12" height="30" rx="3" fill="#22c55e" opacity="0.4"/>
        <rect x="20" y="-50" width="12" height="50" rx="3" fill="#22c55e" opacity="0.8"/>
        <rect x="40" y="-40" width="12" height="40" rx="3" fill="#22c55e" opacity="0.6"/>
        <rect x="60" y="-70" width="12" height="70" rx="3" fill="#22c55e" opacity="0.9"/>
        <rect x="80" y="-20" width="12" height="20" rx="3" fill="#22c55e" opacity="0.3"/>
      </g>

      <!-- Ground Line -->
      <line x1="0" y1="120" x2="260" y2="120" stroke="#059669" stroke-width="2" filter="url(#glow)"/>

      <!-- Animated AI Drone scanning -->
      <g class="drone">
        <!-- drone body -->
        <rect x="-12" y="0" width="24" height="6" rx="3" fill="#94a3b8"/>
        <rect x="-6" y="6" width="12" height="4" rx="2" fill="#475569"/>
        <!-- camera/sensor -->
        <circle cx="0" cy="10" r="4" fill="#0ea5e9" filter="url(#glow)"/>
        <!-- arms -->
        <path d="M-12,3 L-20,-2 M12,3 L20,-2" stroke="#475569" stroke-width="2" stroke-linecap="round"/>
        <!-- spinning props -->
        <ellipse cx="-20" cy="-3" rx="8" ry="1.5" fill="#cbd5e1" opacity="0.6"/>
        <ellipse cx="20" cy="-3" rx="8" ry="1.5" fill="#cbd5e1" opacity="0.6"/>
        <!-- scan beam -->
        <polygon points="0,12 -30,70 30,70" fill="#0ea5e9" class="scan-beam" filter="url(#glow)" opacity="0.3"/>
      </g>

      <!-- Sleek Animated Tractor -->
      <g class="tractor" transform="translate(0, 103)">
        <!-- Tractor Body modern -->
        <path d="M0,17 L45,17 L45,-2 L30,-2 L25,-15 L10,-15 L5,-2 L0,-2 Z" fill="#eab308" />
        <path d="M12,-12 L23,-12 L26,-2 L8,-2 Z" fill="#020617" opacity="0.6"/>
        <rect x="38" y="-12" width="3" height="10" fill="#94a3b8" />
        <circle cx="39.5" cy="-14" r="2" fill="#94a3b8" opacity="0.6"/>
        
        <!-- Wheels -->
        <g transform="translate(10, 17)">
          <circle r="10" fill="#1e293b" stroke="#cbd5e1" stroke-width="2"/>
          <circle r="4" fill="#0f172a" />
          <line x1="-10" y1="0" x2="10" y2="0" stroke="#cbd5e1" stroke-width="1" class="wheel" transform-origin="0 0"/>
          <line x1="0" y1="-10" x2="0" y2="10" stroke="#cbd5e1" stroke-width="1" class="wheel" transform-origin="0 0"/>
        </g>
        <g transform="translate(36, 17)">
          <circle r="6" fill="#1e293b" stroke="#cbd5e1" stroke-width="1.5"/>
          <circle r="2" fill="#0f172a" />
          <line x1="-6" y1="0" x2="6" y2="0" stroke="#cbd5e1" stroke-width="1" class="wheel" transform-origin="0 0"/>
          <line x1="0" y1="-6" x2="0" y2="6" stroke="#cbd5e1" stroke-width="1" class="wheel" transform-origin="0 0"/>
        </g>
      </g>
      
    </g>
  </g>
</svg>
