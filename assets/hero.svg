<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 400">
  <defs>
    <!-- Background Gradient -->
    <linearGradient id="bg-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0d1117" />
      <stop offset="100%" stop-color="#010409" />
    </linearGradient>
    
    <!-- Text Gradient -->
    <linearGradient id="text-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#58a6ff" />
      <stop offset="100%" stop-color="#bd56eb" />
    </linearGradient>

    <!-- Subtle Grid Pattern -->
    <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M 40 0 L 0 0 0 40" fill="none" stroke="#ffffff" stroke-width="0.5" stroke-opacity="0.04" />
    </pattern>
    
    <!-- Drop Shadow for Terminal -->
    <filter id="shadow" x="-10%" y="-10%" width="130%" height="130%">
      <feDropShadow dx="0" dy="10" stdDeviation="15" flood-color="#000000" flood-opacity="0.6"/>
    </filter>
  </defs>

  <style>
    @import url('https://fonts.googleapis.com/css2?family=Inter:wght@400;500;700;800&amp;family=Fira+Code:wght@400;500&amp;display=swap');
    
    .title { font-family: 'Inter', sans-serif; font-size: 54px; font-weight: 800; fill: url(#text-grad); letter-spacing: -1px; }
    .subtitle { font-family: 'Inter', sans-serif; font-size: 20px; font-weight: 500; fill: #c9d1d9; }
    .tagline { font-family: 'Inter', sans-serif; font-size: 16px; font-weight: 400; fill: #8b949e; }
    
    .code-text { font-family: 'Fira Code', monospace; font-size: 14px; font-weight: 500; fill: #c9d1d9; }
    .code-keyword { fill: #ff7b72; }
    .code-string { fill: #a5d6ff; }
    .code-func { fill: #d2a8ff; }
    .code-comment { fill: #8b949e; font-style: italic; }
    
    /* Subtle breathing animation for the terminal */
    .terminal { animation: float 6s ease-in-out infinite; transform-origin: center; }
    @keyframes float {
      0%, 100% { transform: translateY(0px); }
      50% { transform: translateY(-8px); }
    }
  </style>

  <!-- Background Layer -->
  <rect width="100%" height="100%" fill="url(#bg-grad)" rx="16" />
  <rect width="100%" height="100%" fill="url(#grid)" rx="16" />

  <!-- Left Content: Text -->
  <g transform="translate(50, 180)">
    <text class="title" x="0" y="0">Dipendra Kumar</text>
    <text class="subtitle" x="2" y="38">Full Stack Developer &amp; AI Enthusiast</text>
    <text class="subtitle" x="2" y="68">Open Source Learner | Software Engineer</text>
    
    <!-- A sleek divider line -->
    <rect x="2" y="95" width="40" height="4" rx="2" fill="#58a6ff" />
    
    <text class="tagline" x="2" y="125">CS Engineering @ MMDU (Class of 2027)</text>
  </g>

  <!-- Right Content: Terminal Window -->
  <g transform="translate(570, 100)" filter="url(#shadow)">
    <g class="terminal">
      <!-- Terminal Background -->
      <rect x="0" y="0" width="280" height="200" rx="10" fill="#161b22" stroke="#30363d" stroke-width="1"/>
      
      <!-- Mac Window Buttons -->
      <circle cx="20" cy="20" r="6" fill="#ff5f56"/>
      <circle cx="40" cy="20" r="6" fill="#ffbd2e"/>
      <circle cx="60" cy="20" r="6" fill="#27c93f"/>
      
      <!-- Terminal Code Text -->
      <g transform="translate(20, 60)">
        <text class="code-text" x="0" y="0"><tspan class="code-keyword">const</tspan> dev = <tspan class="code-keyword">new</tspan> Developer();</text>
        
        <text class="code-text" x="0" y="25">dev.<tspan class="code-func">setName</tspan>(<tspan class="code-string">"Dipendra"</tspan>);</text>
        <text class="code-text" x="0" y="50">dev.<tspan class="code-func">setRole</tspan>(<tspan class="code-string">"Full Stack"</tspan>);</text>
        
        <text class="code-text" x="0" y="75">dev.<tspan class="code-func">addSkills</tspan>([</text>
        <text class="code-text" x="20" y="100"><tspan class="code-string">"React"</tspan>, <tspan class="code-string">"Node.js"</tspan>, <tspan class="code-string">"AI"</tspan></text>
        <text class="code-text" x="0" y="125">]);</text>
      </g>
    </g>
  </g>
</svg>